title: Xuan Jiang
url: "https://xuan-1998.github.io"
baseurl: ""
timezone: America/Los_Angeles

# The two language versions. Swap the paths here and in the permalinks of
# index.html and zh/index.html to make Chinese the root page.
langs:
  en:
    path: /
    html: en
    hreflang: en
    og_locale: en_US
    switch_label: 中文
  zh:
    path: /zh/
    html: zh-CN
    hreflang: zh-CN
    og_locale: zh_CN
    switch_label: EN
default_lang: en

markdown: kramdown
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - node_modules/
