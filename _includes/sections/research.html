{%- assign R = site.data.text.research -%}
<section class="container sec sec-research" id="research" aria-labelledby="research-title">
  <h2 id="research-title">{{ R.title }}</h2>
  <hr>
  <p class="lede">{{ R.lede }}</p>
  <details class="overview">
    <summary>{{ R.overview_label }}</summary>
    <div class="overview-body">
      {%- for a in R.areas %}
      <p><span class="area">{{ a.name }}:</span> {{ a.text }}</p>
      {%- endfor %}
    </div>
  </details>
</section>
