{%- assign tx = site.data.text -%}
<div class="container intro">
  <div class="row">
    <div class="col-md-3 intro-photo">
      <img src="{{ '/assets/img/portrait.webp' | relative_url }}" srcset="{{ '/assets/img/portrait.webp' | relative_url }} 540w, {{ '/assets/img/portrait-2x.webp' | relative_url }} 1080w" sizes="260px" width="540" height="461" alt="{{ tx.intro.photo_alt }}" fetchpriority="high">
    </div>
    <div class="col-md-9 intro-text">
      <h1 class="name">{{ site.data.profile.name }}</h1>
      {%- for para in tx.intro.bio %}
      <p>{{ para }}</p>
      {%- endfor %}
      <p>{{ tx.intro.email }}</p>
      <div class="icon-row">
        {% include social.html sep=true %}
      </div>
    </div>
  </div>
</div>
