<section class="container sec sec-projects" id="open-source" aria-labelledby="projects-title">
  <h2 id="projects-title">{{ site.data.text.projects.title }}</h2>
  <hr>
  {%- for pr in site.data.projects %}
  <div class="project">
    <div class="project-head">
      <span class="project-name">{{ pr.name }}</span>
      <span class="pills">
        {%- for l in pr.links %}<a class="pill" href="{{ l.url }}" target="_blank" rel="noopener">{{ l.label }}</a>{% endfor -%}
      </span>
    </div>
    <p>{{ pr.desc }}</p>
  </div>
  {%- endfor %}
</section>
