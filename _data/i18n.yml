  research:
    eyebrow: 研究
    h2: 从模型到系统。
    rows:
    - title: MoE 与高效微调
      thesis: 混合专家模型（MoE）的能力集中于少量 FFN 中间维度，很少被激活的长尾专家仍保留有用知识。我研究在压缩或微调时保留两者，并降低微调的 GPU 显存需求。
    - title: GPU 通信
      thesis: 专家并行时，每层都向其他 GPU 分发 token，再合并结果。我为此写内核和传输代码，也支持不保证按序交付的传输。
    - title: 自进化智能体
      thesis: 我开发能从自身记录和反馈中持续改进的智能体。它们可以更新模型权重，也可以修改提示词和规则。
    - title: 高性能计算与仿真
      thesis: 我从交通仿真开始做系统研究，用多张 GPU 模拟整座城市的交通，也研究城市空中交通的仿真。
