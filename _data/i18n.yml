  agents:
    eyebrow: Self-evolving agents
    h2_line1: Agents learn
    h2_line2: from what they do.
    intro: 'I contribute to reef and CORAL, two open-source systems for self-evolving agents. reef uses interaction records and feedback to update model weights or the agent''s harness: prompts, rules, and skills. CORAL runs long-lived agents that explore and collaborate through shared persistent memory.'
    loop_title: The reef learning loop
    loop_caption: Based on the learning loop documented by reef.
    stages:
    - name: Serve
      desc: Serve requests and record interactions.
    - name: Observe
      desc: Match feedback to recorded interactions.
    - name: Grow
      desc: Produce updates from eligible records.
    - name: Commit
      desc: Evaluate candidates and publish accepted updates to version history.
    reef:
      tag: Open source, team member
      title: reef
      what: reef connects agent inference, feedback, learning, and versioned delivery so agents can continually improve.
      role: I'm on the team, with 25 PRs authored and 18 merged.
      body: I added reef's Claude Code harness adapter and CORAL test-time-training example, and fixed training-stack bugs. For SAO, an asynchronous RL method from another group's paper, I added the paper's value-model warmup and learning rate to reef's example, plus batch-128 runs configured like the paper's, documenting results and limitations.
      repo: View the repository
      prs: My pull requests
    coral:
      tag: Open source, COLM 2026
      title: CORAL
      what: CORAL is an open-source research system where autonomous coding agents explore and collaborate through shared persistent memory.
      role: I co-authored the COLM 2026 paper and authored 14 PRs, with 12 merged.
      body: I updated the LLM gateway to record streamed responses in request logs and added a hook for supplying headers. I also fixed CLI and agent runtime issues and updated the docs.
      repo: View the repository
      paper: Read on arXiv
      prs: My pull requests
