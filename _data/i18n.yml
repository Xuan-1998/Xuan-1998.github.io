  research:
    eyebrow: Research
    h2: From models to systems.
    rows:
    - title: MoE and efficient fine-tuning
      thesis: Capabilities in MoE models concentrate in a few FFN intermediate dimensions; rarely activated, long-tailed experts retain useful knowledge. I work on preserving both during compression or fine-tuning, and on fine-tuning that uses less GPU memory.
    - title: GPU communication
      thesis: Each MoE layer dispatches tokens to experts on other GPUs and combines their results. I write kernels and transport code for this path, including kernels for transports without ordered delivery.
    - title: Self-evolving agents
      thesis: I build agents that use their own records and feedback to keep improving. Updates can change model weights or revise the prompts and rules they follow.
    - title: HPC and simulation
      thesis: My systems work began with simulation. I built a simulator that runs city-scale traffic across several GPUs, with applications in urban and air mobility.
