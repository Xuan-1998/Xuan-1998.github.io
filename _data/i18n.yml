  works:
    eyebrow: Open source
    h2_line1: Selected research
    h2_line2: and open source.
    cards:
      coral:
        meta: Multi-agent research, COLM 2026
        title: CORAL
        desc: CORAL lets long-running agents explore, reflect, and collaborate through shared persistent memory and asynchronous execution. The paper reports new state-of-the-art results on 10 tasks.
        go: Read the paper
      lpsim:
        meta: Simulation system, Transportation Research Part C 2024
        title: LPSim
        desc: I built LPSim for traffic simulation across multiple GPUs, using graph partitioning and ghost-zone vehicle migration. It handles networks with over 223,000 nodes in seconds on one GPU. I also worked with James Demmel and Roofline model creator Samuel Williams on in-depth performance optimization.
        go: View the code
      smt:
        meta: Model fine-tuning, ICLR 2025
        title: Sparse Matrix Tuning
        desc: SMT updates only the most significant sub-matrices selected from gradient updates. It outperforms LoRA and DoRA across tasks on LLaMA-family models, using 67% less GPU memory than full fine-tuning.
        go: Read the paper
      rast:
        meta: Reinforcement learning, ICML 2026
        title: RAST-MoE-RL
        desc: RAST-MoE-RL, a 12M-parameter model, uses regime-aware modeling and a self-attention mixture-of-experts encoder to set pre-match waits for batched ride-hailing requests and vehicles, cutting average matching delay by 10% and pickup delay by 15% on real San Francisco trajectories.
        go: Read the paper
      icrat:
        meta: Air mobility, ICRAT 2024
        title: Wind-Resilient AAM Networks
        desc: Our simulation-optimization framework models wind variability and nonlinear charging across multiple vertiports to optimize advanced air mobility (AAM) fleet size and scheduling. Wind affects fleet size even on short flights, with larger effects on longer ones.
        go: Read the paper
      lessmoe:
        meta: MoE compression, EMNLP 2026
        title: Less is MoE
        desc: 'Capabilities concentrate in sparse FFN intermediate dimensions: in Qwen1.5-MoE, removing 12 of its 1.35M routed-FFN intermediate dimensions collapses GSM8K accuracy. At 50% compression, Fisher-MoE preserves capability with about 45% less weight memory and 21% higher inference throughput.'
        go: Read the paper
        alt: An expert FFN with edges colored by Fisher importance; top 50% of intermediate dimensions retained, the rest removed
      condenser:
        meta: MoE fine-tuning, COLM 2026
        title: ExpertCondenser
        desc: ExpertCondenser fine-tunes MoE models without auxiliary loss, using bias-driven sparsification and always-active gated condenser experts to retain rarely used experts' knowledge. On mathematical reasoning and commonsense QA, it improves on DenseMixer and ESFT by more than 2.5% on average.
        go: Read the paper
        alt: Framework with trainable router biases and always-active condenser experts beside routed experts
    coral_stat: Four co-evolving CORAL agents set a new record on Anthropic's kernel engineering task, measured in cycles; lower is better.
