  works:
    eyebrow: 开源
    h2_line1: 精选研究
    h2_line2: 与开源工作。
    cards:
      coral:
        meta: 多智能体研究，COLM 2026
        title: CORAL
        desc: CORAL 让长期运行的智能体通过持久记忆共享经验，并异步探索、反思与协作。论文报告了 10 项任务上的新最优结果。
        go: 阅读论文
      lpsim:
        meta: 仿真系统，Transportation Research Part C 2024
        title: LPSim
        desc: 我开发了多 GPU 交通仿真器 LPSim：图划分把路网分到多块 GPU，车辆跨分区时经幽灵区迁移；单块 GPU 几秒内就能处理超过 22.3 万个节点的路网。我还与 James Demmel 以及 Roofline 模型的提出者 Samuel Williams 一起，深入优化了 LPSim 的性能。
        go: 查看代码
      smt:
        meta: 模型微调，ICLR 2025
        title: Sparse Matrix Tuning
        desc: SMT 只更新梯度中最显著的子矩阵，在 LLaMA 系列模型的多项任务上优于 LoRA 和 DoRA，显存占用比全量微调减少 67%。
        go: 阅读论文
      rast:
        meta: 强化学习，ICML 2026
        title: RAST-MoE-RL
        desc: 这个 1200 万参数的模型用状态感知（regime-aware）建模和自注意力混合专家编码器决定网约车订单与车辆批量匹配前等多久，在旧金山真实轨迹上将平均匹配延迟降低 10%，接驾延迟降低 15%。
        go: 阅读论文
      icrat:
        meta: 空中交通，ICRAT 2024
        title: Wind-Resilient AAM Networks
        desc: 这套仿真优化框架将风况变化纳入先进空中交通（AAM），结合多座垂直起降场的非线性充电模型优化机队规模与调度。即使航程较短，风也会影响机队规模；航程越长，影响越大。
        go: 阅读论文
      lessmoe:
        meta: MoE 压缩，EMNLP 2026
        title: Less is MoE
        desc: 模型能力集中在稀疏的 FFN 中间维度：Qwen1.5-MoE 去掉 135 万维中的 12 维，GSM8K 准确率便骤降。按 Fisher 重要性压缩 50% 后，模型基本保留能力，权重内存减少约 45%，推理吞吐提高 21%。
        go: 阅读论文
        alt: 一个专家 FFN 的连线按 Fisher 重要性着色，保留重要性最高的 50% 中间维度，其余删除
      condenser:
        meta: MoE 微调，COLM 2026
        title: ExpertCondenser
        desc: 该方法无需辅助损失，用偏置驱动稀疏化与始终激活的门控凝聚专家保留长尾专家知识，在数学推理与常识问答上比 DenseMixer 和 ESFT 平均提升超过 2.5%。
        go: 阅读论文
        alt: 路由器含可训练偏置，路由专家旁为始终激活的凝聚专家
    coral_stat: 四个 CORAL 智能体协同进化，降低了 Anthropic 内核工程任务的已知最低周期数。
    lpsim_alt: 旧金山湾区路网划分给多个 GPU，每个分区用不同颜色表示
    award_badge: 最佳论文奖
  agents:
    eyebrow: 自进化智能体
    h2_line1: 让智能体
    h2_line2: 从自己的经验中学习。
    intro: 我参与 reef、CORAL 两个开源自进化智能体系统的开发。reef 用交互记录和反馈更新模型权重或 harness（提示词、规则和技能）；CORAL 让长期运行的智能体通过共享持久记忆探索与协作。
    loop_title: reef 的学习循环
    loop_caption: 按 reef 文档中的流程整理。
    stages:
    - name: 服务（Serve）
      desc: 响应请求并记录交互
    - name: 观察（Observe）
      desc: 将反馈匹配到交互记录
    - name: 改进（Grow）
      desc: 根据符合条件的记录生成更新
    - name: 提交（Commit）
      desc: 评估候选，将通过的更新写入版本历史
    reef:
      tag: 开源，团队成员
      title: reef
      what: reef 将智能体推理、反馈、学习和版本化发布连接起来。
      role: 我是团队成员，提交了 25 个 PR，其中 18 个已合并。
      body: 我为 reef 添加 Claude Code harness 适配器和 CORAL 测试时训练示例，修复训练栈多个问题。我将论文的价值模型预热与学习率用于 SAO 示例，按论文新增批量为 128 的运行，记录结果与局限。
      repo: 查看代码仓库
      prs: 查看我的 PR
    coral:
      tag: 开源，COLM 2026
      title: CORAL
      what: CORAL 是开源自主研究系统，让编程智能体通过共享记忆开展探索与协作。
      role: 我是 CORAL 论文（COLM 2026）的合著者，提交了 14 个 PR，其中 12 个已合并。
      body: 我在大语言模型网关的请求日志里记录完整的流式响应，并加了一个提供请求头的回调接口；我也修复了命令行和智能体运行时的问题，并补充了文档。
      repo: 查看代码仓库
      paper: 在 arXiv 阅读论文
      prs: 查看我的 PR
