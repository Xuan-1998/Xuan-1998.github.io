misc:
  title: Misc
  positions_label: Experience
  positions:
    - when: 2026 to present
      org: Amazon Web Services (AWS), Annapurna Labs
      text: Sr. HPC/AI Engineer. I work on GPU communication performance on large GPU clusters and optimize kernels for mixture-of-experts expert parallelism, and with NVIDIA's NCCL team, I co-lead the work to run NCCL EP on EFA. I co-led DeepEP v2 on EFA and led the NVSHMEM work for DeepEP v1 with NVIDIA's NVSHMEM team, where the changes shipped in NVSHMEM 3.7.0.
    - when: 2024 to 2026
      org: Google
      text: Software Engineer. I led AI-assisted workflows for large-scale code changes and AI-powered integration test setups. I built multi-agent frameworks for agentic code generation and launched alert-based investigations in Google Cloud Assist.
    - when: 2023 to present
      org: <a href="https://mobility.mit.edu/biblio-author/xuan-jiang/" target="_blank" rel="noopener">MIT</a>
      text: Research Affiliate. With Jinhua Zhao and Haris Koutsopoulos, I work on reinforcement learning to optimize complex systems using HPC-based simulators and on LLM agents for cloud anomaly detection. Since 2026, I have also built self-evolving agents with the reef team and co-authored CORAL (COLM 2026).
    - when: 2022 to 2025
      org: <a href="https://air.berkeley.edu/xuan-jiang/" target="_blank" rel="noopener">UC Berkeley</a>
      text: Graduate Student Researcher at the Aviation Innovation Research (AIR) Lab and the Cal Unmanned Lab (2022 to 2024). Researched HPC with James Demmel and Raja Sengupta using GPU-based multimodal time-driven simulation (2022 to 2025).
    - when: 2022 to 2023
      org: University of Washington STAR Lab
      text: Research Assistant. Worked on TinT for city-wide congestion prediction.
